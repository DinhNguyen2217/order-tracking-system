server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for nginx itself
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
