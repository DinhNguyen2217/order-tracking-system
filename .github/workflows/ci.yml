name: CI Pipeline

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  # ── Backend: lint + health check ──
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace)
        run: npm install

      - name: Lint — check syntax
        working-directory: backend
        run: node --check server.js && node --check db.js

      - name: Health check — start server and verify /api/health
        working-directory: backend
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 4
          curl -f http://localhost:5000/api/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
        env:
          PORT: 5000
          DB_PATH: ./database.sqlite

  # ── Frontend: build ──
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace)
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ""

      - name: Verify build output exists
        working-directory: frontend
        run: test -f dist/index.html

  # ── Docker: build images ──
  docker:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: order-tracking-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: order-tracking-frontend:ci
